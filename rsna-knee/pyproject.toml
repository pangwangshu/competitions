[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection (Kaggle 2026) — multimodal knee MRI + radiology reports"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pydicom",
    "matplotlib",
    "scikit-learn",
    "tqdm",
    "kaggle",
    "remotezip>=0.12.6",
]

[project.optional-dependencies]
torch = ["torch"]
dev = ["ipykernel", "jupyterlab", "pytest"]
infer = [
    "opencv-python-headless>=5.0.0.93",
    "pylibjpeg>=2.1.0",
    "pylibjpeg-libjpeg>=2.4.0",
    "pylibjpeg-openjpeg>=2.6.0",
    "timm>=1.0.30",
    "torch>=2.14.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsna_knee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
